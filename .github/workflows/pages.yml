name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Valide aussi les PR de contenu (build + lint strict), sans déployer.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Aucun guide ne doit préparer à un examen retiré (retired-exams.json).
      - name: Check retired exams
        run: node scripts/check-exams.mjs

      - name: Build all published guides + homepage
        run: |
          # Build chaque guide listé comme "published" dans le manifeste
          for id in $(node -e "
            const m = require('./guides.json');
            for (const g of m.guides) if (g.status === 'published') console.log(g.id);
          "); do
            echo "→ building $id"
            node build.mjs "$id" --strict
          done

      - name: Disable Jekyll
        run: touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
