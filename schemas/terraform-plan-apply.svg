  <text class="ttl" x="380" y="22" text-anchor="middle">Cycle plan / apply</text><rect class="box" x="16.5" y="40" width="225" height="66" rx="3"/><text class="lbl" x="129" y="77" text-anchor="middle">code + state + réel</text><path class="arrow" d="M 241.5 73 L 267.5 73"/><rect class="box-accent" x="267.5" y="40" width="225" height="66" rx="3"/><text class="lbl lbl-fill" x="380" y="70.5" text-anchor="middle">plan</text><text class="sub sub-fill" x="380" y="83.5" text-anchor="middle">diff</text><path class="arrow" d="M 492.5 73 L 518.5 73"/><rect class="box" x="518.5" y="40" width="225" height="66" rx="3"/><text class="lbl" x="631" y="70.5" text-anchor="middle">apply</text><text class="sub" x="631" y="83.5" text-anchor="middle">application</text>
