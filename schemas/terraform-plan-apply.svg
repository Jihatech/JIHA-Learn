<svg viewBox="0 0 760 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-terraform-plan-apply">
  <title id="s-terraform-plan-apply">Cycle plan / apply</title>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5}
