<svg viewBox="0 0 760 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-linux-permissions">
  <title id="s-linux-permissions">Permissions Linux</title>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5}
    .box-accent{fill:#ffb627;stroke:#c98d10;stroke-width:1.5}
    .box-soft{fill:#1e3a5f;stroke:#1e3a5f;stroke-width:1.5}
    .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;fill:currentColor;font-weight:600}
    .lbl-fill{fill:#0d1117}.lbl-blue{fill:#f5f0e6}
    .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;fill:currentColor;opacity:.62}
    .sub-fill{fill:#0d1117;opacity:.72}.sub-blue{fill:#d1d9e0;opacity:.85}
    .ttl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;fill:currentColor;opacity:.8;font-weight:600}
    .arrow{stroke:currentColor;stroke-width:1.5;fill:none;marker-end:url(#ar)}
    .dash{stroke:#ffb627;stroke-dasharray:5,3;stroke-width:1.4;fill:none}
  </style>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Permissions Linux</text><rect class="box" x="16.5" y="40" width="225" height="66" rx="3"/><text class="lbl" x="129" y="70.5" text-anchor="middle">rwx</text><text class="sub" x="129" y="83.5" text-anchor="middle">propriétaire</text><path class="arrow" d="M 241.5 73 L 267.5 73"/><rect class="box" x="267.5" y="40" width="225" height="66" rx="3"/><text class="lbl" x="380" y="70.5" text-anchor="middle">rwx</text><text class="sub" x="380" y="83.5" text-anchor="middle">groupe</text><path class="arrow" d="M 492.5 73 L 518.5 73"/><rect class="box" x="518.5" y="40" width="225" height="66" rx="3"/><text class="lbl" x="631" y="70.5" text-anchor="middle">rwx</text><text class="sub" x="631" y="83.5" text-anchor="middle">autres</text><path class="arrow" d="M 631 106 L 631 126 L 254.5 126 L 254.5 146"/><rect class="box-accent" x="142" y="146" width="225" height="66" rx="3"/><text class="lbl lbl-fill" x="254.5" y="176.5" text-anchor="middle">SUID/SGID/sticky</text><text class="sub sub-fill" x="254.5" y="189.5" text-anchor="middle">4ᵉ chiffre</text><path class="arrow" d="M 367 179 L 393 179"/><rect class="box-soft" x="393" y="146" width="225" height="66" rx="3"/><text class="lbl lbl-blue" x="505.5" y="176.5" text-anchor="middle">ACL</text><text class="sub sub-blue" x="505.5" y="189.5" text-anchor="middle">droits fins par user/group</text>
</svg>
