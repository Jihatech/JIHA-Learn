<svg viewBox="0 0 760 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-ansible-flow-control">
  <title id="s-ansible-flow-control">Flux d’exécution d’une tâche</title>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5}
    .box-accent{fill:#ffb627;stroke:#c98d10;stroke-width:1.5}
    .box-soft{fill:#1e3a5f;stroke:#1e3a5f;stroke-width:1.5}
    .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;fill:currentColor;font-weight:600}
    .lbl-fill{fill:#0d1117}.lbl-blue{fill:#f5f0e6}
    .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;fill:currentColor;opacity:.62}
    .sub-fill{fill:#0d1117;opacity:.72}.sub-blue{fill:#d1d9e0;opacity:.85}
    .ttl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;fill:currentColor;opacity:.8;font-weight:600}
    .arrow{stroke:currentColor;stroke-width:1.5;fill:none;marker-end:url(#ar)}
    .dash{stroke:#ffb627;stroke-dasharray:5,3;stroke-width:1.4;fill:none}
  </style>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Flux d’exécution d’une tâche</text><rect class="box" x="17" y="40" width="162" height="66" rx="3"/><text class="lbl" x="98" y="70.5" text-anchor="middle">loop</text><text class="sub" x="98" y="83.5" text-anchor="middle">répète</text><path class="arrow" d="M 179 73 L 205 73"/><rect class="box" x="205" y="40" width="162" height="66" rx="3"/><text class="lbl" x="286" y="70.5" text-anchor="middle">when</text><text class="sub" x="286" y="83.5" text-anchor="middle">filtre</text><path class="arrow" d="M 367 73 L 393 73"/><rect class="box" x="393" y="40" width="162" height="66" rx="3"/><text class="lbl" x="474" y="70.5" text-anchor="middle">register</text><text class="sub" x="474" y="83.5" text-anchor="middle">capture</text><path class="arrow" d="M 555 73 L 581 73"/><rect class="box" x="581" y="40" width="162" height="66" rx="3"/><text class="lbl" x="662" y="70.5" text-anchor="middle">changed/failed_when</text><text class="sub" x="662" y="83.5" text-anchor="middle">redéfinit le statut</text><path class="arrow" d="M 662 106 L 662 126 L 286 126 L 286 146"/><rect class="box" x="205" y="146" width="162" height="66" rx="3"/><text class="lbl" x="286" y="176.5" text-anchor="middle">notify</text><text class="sub" x="286" y="189.5" text-anchor="middle">arme un handler</text><path class="arrow" d="M 367 179 L 393 179"/><rect class="box-accent" x="393" y="146" width="162" height="66" rx="3"/><text class="lbl lbl-fill" x="474" y="176.5" text-anchor="middle">block/rescue/always</text><text class="sub sub-fill" x="474" y="189.5" text-anchor="middle">encadre l’erreur</text>
</svg>
