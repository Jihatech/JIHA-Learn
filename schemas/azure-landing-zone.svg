  <text class="ttl" x="380" y="22" text-anchor="middle">Zone d’atterrissage (AZ-104)</text><rect class="box-accent" x="16.5" y="40" width="225" height="66" rx="3"/><text class="lbl lbl-fill" x="129" y="64" text-anchor="middle">RÉSEAU</text><text class="sub sub-fill" x="129" y="77" text-anchor="middle">VNet hub + sous-réseaux + NSG ·</text><text class="sub sub-fill" x="129" y="89" text-anchor="middle">Terraform live</text><path class="arrow" d="M 241.5 73 L 267.5 73"/><rect class="box-soft" x="267.5" y="40" width="225" height="66" rx="3"/><text class="lbl lbl-blue" x="380" y="64" text-anchor="middle">CHARGES</text><text class="sub sub-blue" x="380" y="77" text-anchor="middle">stockage · identité managée · VM ·</text><text class="sub sub-blue" x="380" y="89" text-anchor="middle">azlocal</text><path class="arrow" d="M 492.5 73 L 518.5 73"/><rect class="box" x="518.5" y="40" width="225" height="66" rx="3"/><text class="lbl" x="631" y="70.5" text-anchor="middle">DURCISSEMENT</text><text class="sub" x="631" y="83.5" text-anchor="middle">RBAC + policy tag + verrou · Bicep</text><text class="sub" x="380" y="144" text-anchor="middle">tags communs · appliqué → vérifié → détruit sur miniblue</text>
