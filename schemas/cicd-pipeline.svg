  <text class="ttl" x="380" y="22" text-anchor="middle">Pipeline CI/CD (workflow)</text><rect class="box" x="18" y="40" width="124" height="66" rx="3"/><text class="lbl" x="80" y="77" text-anchor="middle">push</text><path class="arrow" d="M 142 73 L 168 73"/><rect class="box" x="168" y="40" width="124" height="66" rx="3"/><text class="lbl" x="230" y="70.5" text-anchor="middle">checkout</text><text class="sub" x="230" y="83.5" text-anchor="middle">récupère le code</text><path class="arrow" d="M 292 73 L 318 73"/><rect class="box-accent" x="318" y="40" width="124" height="66" rx="3"/><text class="lbl lbl-fill" x="380" y="77" text-anchor="middle">test</text><path class="arrow" d="M 442 73 L 468 73"/><rect class="box" x="468" y="40" width="124" height="66" rx="3"/><text class="lbl" x="530" y="77" text-anchor="middle">build image</text><path class="arrow" d="M 592 73 L 618 73"/><rect class="box-soft" x="618" y="40" width="124" height="66" rx="3"/><text class="lbl lbl-blue" x="680" y="77" text-anchor="middle">publish</text>
</svg>
