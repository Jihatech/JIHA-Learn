<svg viewBox="0 0 760 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-linux-filesystem">
  <title id="s-linux-filesystem">Arborescence Linux (FHS) — depuis /</title>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5}
    .box-accent{fill:#ffb627;stroke:#c98d10;stroke-width:1.5}
    .box-soft{fill:#1e3a5f;stroke:#1e3a5f;stroke-width:1.5}
    .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;fill:currentColor;font-weight:600}
    .lbl-fill{fill:#0d1117}.lbl-blue{fill:#f5f0e6}
    .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;fill:currentColor;opacity:.62}
    .sub-fill{fill:#0d1117;opacity:.72}.sub-blue{fill:#d1d9e0;opacity:.85}
    .ttl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;fill:currentColor;opacity:.8;font-weight:600}
    .arrow{stroke:currentColor;stroke-width:1.5;fill:none;marker-end:url(#ar)}
    .dash{stroke:#ffb627;stroke-dasharray:5,3;stroke-width:1.4;fill:none}
  </style>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Arborescence Linux (FHS) — depuis /</text><rect class="box" x="16" y="40" width="168" height="62" rx="3"/><text class="lbl" x="100" y="68.5" text-anchor="middle">/etc</text><text class="sub" x="100" y="81.5" text-anchor="middle">config</text><rect class="box" x="202" y="40" width="168" height="62" rx="3"/><text class="lbl" x="286" y="68.5" text-anchor="middle">/var</text><text class="sub" x="286" y="81.5" text-anchor="middle">données variables</text><rect class="box" x="388" y="40" width="168" height="62" rx="3"/><text class="lbl" x="472" y="68.5" text-anchor="middle">/home</text><text class="sub" x="472" y="81.5" text-anchor="middle">utilisateurs</text><rect class="box" x="574" y="40" width="168" height="62" rx="3"/><text class="lbl" x="658" y="68.5" text-anchor="middle">/usr</text><text class="sub" x="658" y="81.5" text-anchor="middle">programmes</text><rect class="box" x="16" y="118" width="168" height="62" rx="3"/><text class="lbl" x="100" y="146.5" text-anchor="middle">/bin · /sbin</text><text class="sub" x="100" y="159.5" text-anchor="middle">binaires</text><rect class="box" x="202" y="118" width="168" height="62" rx="3"/><text class="lbl" x="286" y="146.5" text-anchor="middle">/tmp</text><text class="sub" x="286" y="159.5" text-anchor="middle">temporaire</text><rect class="box" x="388" y="118" width="168" height="62" rx="3"/><text class="lbl" x="472" y="146.5" text-anchor="middle">/dev · /proc</text><text class="sub" x="472" y="159.5" text-anchor="middle">système</text><rect class="box" x="574" y="118" width="168" height="62" rx="3"/><text class="lbl" x="658" y="146.5" text-anchor="middle">/srv</text><text class="sub" x="658" y="159.5" text-anchor="middle">services</text>
</svg>
