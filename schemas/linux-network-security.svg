<svg viewBox="0 0 760 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-linux-network-security">
  <title id="s-linux-network-security">Réseau &amp; sécurité en ligne de commande</title>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5}
    .box-accent{fill:#ffb627;stroke:#c98d10;stroke-width:1.5}
    .box-soft{fill:#1e3a5f;stroke:#1e3a5f;stroke-width:1.5}
    .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;fill:currentColor;font-weight:600}
    .lbl-fill{fill:#0d1117}.lbl-blue{fill:#f5f0e6}
    .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;fill:currentColor;opacity:.62}
    .sub-fill{fill:#0d1117;opacity:.72}.sub-blue{fill:#d1d9e0;opacity:.85}
    .ttl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;fill:currentColor;opacity:.8;font-weight:600}
    .arrow{stroke:currentColor;stroke-width:1.5;fill:none;marker-end:url(#ar)}
    .dash{stroke:#ffb627;stroke-dasharray:5,3;stroke-width:1.4;fill:none}
  </style>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Réseau &amp; sécurité en ligne de commande</text><rect class="box" x="16" y="40" width="230" height="62" rx="3"/><text class="lbl" x="131" y="68.5" text-anchor="middle">ip</text><text class="sub" x="131" y="81.5" text-anchor="middle">adresses / routes</text><rect class="box" x="264" y="40" width="230" height="62" rx="3"/><text class="lbl" x="379" y="68.5" text-anchor="middle">ss</text><text class="sub" x="379" y="81.5" text-anchor="middle">ports ouverts</text><rect class="box" x="512" y="40" width="230" height="62" rx="3"/><text class="lbl" x="627" y="68.5" text-anchor="middle">DNS</text><text class="sub" x="627" y="81.5" text-anchor="middle">résout les noms</text><rect class="box" x="16" y="118" width="230" height="62" rx="3"/><text class="lbl" x="131" y="146.5" text-anchor="middle">SSH</text><text class="sub" x="131" y="159.5" text-anchor="middle">clés, pas mot de passe</text><rect class="box-accent" x="264" y="118" width="230" height="62" rx="3"/><text class="lbl lbl-fill" x="379" y="146.5" text-anchor="middle">ufw</text><text class="sub sub-fill" x="379" y="159.5" text-anchor="middle">deny par défaut</text><rect class="box" x="512" y="118" width="230" height="62" rx="3"/><text class="lbl" x="627" y="146.5" text-anchor="middle">filtrage entrée</text><text class="sub" x="627" y="159.5" text-anchor="middle">pare-feu</text>
</svg>
