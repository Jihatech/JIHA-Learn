<svg viewBox="0 0 760 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-azure-reseau-hybride-connexions">
  <title id="s-azure-reseau-hybride-connexions">Connectivité hybride — le bon lien</title>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5}
    .box-accent{fill:#ffb627;stroke:#c98d10;stroke-width:1.5}
    .box-soft{fill:#1e3a5f;stroke:#1e3a5f;stroke-width:1.5}
    .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;fill:currentColor;font-weight:600}
    .lbl-fill{fill:#0d1117}.lbl-blue{fill:#f5f0e6}
    .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;fill:currentColor;opacity:.62}
    .sub-fill{fill:#0d1117;opacity:.72}.sub-blue{fill:#d1d9e0;opacity:.85}
    .ttl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;fill:currentColor;opacity:.8;font-weight:600}
    .arrow{stroke:currentColor;stroke-width:1.5;fill:none;marker-end:url(#ar)}
    .dash{stroke:#ffb627;stroke-dasharray:5,3;stroke-width:1.4;fill:none}
  </style>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Connectivité hybride — le bon lien</text><rect class="box-accent" x="16" y="40" width="355" height="62" rx="3"/><text class="lbl lbl-fill" x="193.5" y="68.5" text-anchor="middle">VNet Peering</text><text class="sub sub-fill" x="193.5" y="81.5" text-anchor="middle">privé · faible latence · non transitif</text><rect class="box" x="389" y="40" width="355" height="62" rx="3"/><text class="lbl" x="566.5" y="68.5" text-anchor="middle">Gateway transit</text><text class="sub" x="566.5" y="81.5" text-anchor="middle">les spokes empruntent la passerelle du hub</text><rect class="box" x="16" y="118" width="355" height="62" rx="3"/><text class="lbl" x="193.5" y="146.5" text-anchor="middle">VPN Site-to-Site</text><text class="sub" x="193.5" y="159.5" text-anchor="middle">IPsec via Internet · rapide/pas cher</text><rect class="box" x="389" y="118" width="355" height="62" rx="3"/><text class="lbl" x="566.5" y="146.5" text-anchor="middle">ExpressRoute</text><text class="sub" x="566.5" y="159.5" text-anchor="middle">lien privé dédié · débit garanti · SLA</text><text class="sub" x="380" y="214" text-anchor="middle">BGP propage les routes dynamiquement</text>
</svg>
