  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Build multi-stage</text><rect class="box-soft" x="17" y="40" width="162" height="66" rx="3"/><text class="lbl lbl-blue" x="98" y="70.5" text-anchor="middle">Étape build</text><text class="sub sub-blue" x="98" y="83.5" text-anchor="middle">compilateur + sources</text><path class="arrow" d="M 179 73 L 205 73"/><rect class="box" x="205" y="40" width="162" height="66" rx="3"/><text class="lbl" x="286" y="77" text-anchor="middle">binaire</text><path class="arrow" d="M 367 73 L 393 73"/><rect class="box-accent" x="393" y="40" width="162" height="66" rx="3"/><text class="lbl lbl-fill" x="474" y="70.5" text-anchor="middle">Étape finale</text><text class="sub sub-fill" x="474" y="83.5" text-anchor="middle">copie le binaire seul</text><path class="arrow" d="M 555 73 L 581 73"/><rect class="box" x="581" y="40" width="162" height="66" rx="3"/><text class="lbl" x="662" y="77" text-anchor="middle">image minuscule</text>
