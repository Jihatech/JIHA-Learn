    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Anatomie d’une VM</text><rect class="box" x="17" y="40" width="162" height="66" rx="3"/><text class="lbl" x="98" y="70.5" text-anchor="middle">Taille</text><text class="sub" x="98" y="83.5" text-anchor="middle">CPU/RAM</text><path class="arrow" d="M 179 73 L 205 73"/><rect class="box" x="205" y="40" width="162" height="66" rx="3"/><text class="lbl" x="286" y="70.5" text-anchor="middle">Image</text><text class="sub" x="286" y="83.5" text-anchor="middle">OS</text><path class="arrow" d="M 367 73 L 393 73"/><rect class="box-accent" x="393" y="40" width="162" height="66" rx="3"/><text class="lbl lbl-fill" x="474" y="70.5" text-anchor="middle">Disque OS managé</text><text class="sub sub-fill" x="474" y="83.5" text-anchor="middle">± disques data</text><path class="arrow" d="M 555 73 L 581 73"/><rect class="box-soft" x="581" y="40" width="162" height="66" rx="3"/><text class="lbl lbl-blue" x="662" y="70.5" text-anchor="middle">Carte réseau</text><text class="sub sub-blue" x="662" y="83.5" text-anchor="middle">sous-réseau</text><text class="sub" x="380" y="144" text-anchor="middle">HA : groupe à haute dispo / zones · élasticité : scale set + autoscale · seul Deallocated arrête le coût calcul</text>
</svg>
