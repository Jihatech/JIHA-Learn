<svg viewBox="0 0 760 354" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s-docker-security">
  <title id="s-docker-security">Défense en couches (conteneur)</title>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.5}
    .box-accent{fill:#ffb627;stroke:#c98d10;stroke-width:1.5}
    .box-soft{fill:#1e3a5f;stroke:#1e3a5f;stroke-width:1.5}
    .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;fill:currentColor;font-weight:600}
    .lbl-fill{fill:#0d1117}.lbl-blue{fill:#f5f0e6}
    .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;fill:currentColor;opacity:.62}
    .sub-fill{fill:#0d1117;opacity:.72}.sub-blue{fill:#d1d9e0;opacity:.85}
    .ttl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;fill:currentColor;opacity:.8;font-weight:600}
    .arrow{stroke:currentColor;stroke-width:1.5;fill:none;marker-end:url(#ar)}
    .dash{stroke:#ffb627;stroke-dasharray:5,3;stroke-width:1.4;fill:none}
  </style>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <text class="ttl" x="380" y="22" text-anchor="middle">Défense en couches (conteneur)</text><rect class="box" x="90" y="40" width="580" height="40" rx="3"/><text class="lbl" x="380" y="57.5" text-anchor="middle">non-root</text><text class="sub" x="380" y="70.5" text-anchor="middle">USER</text><rect class="box" x="90" y="90" width="580" height="40" rx="3"/><text class="lbl" x="380" y="114" text-anchor="middle">capabilities minimales</text><rect class="box" x="90" y="140" width="580" height="40" rx="3"/><text class="lbl" x="380" y="164" text-anchor="middle">rootfs read-only</text><rect class="box" x="90" y="190" width="580" height="40" rx="3"/><text class="lbl" x="380" y="214" text-anchor="middle">limites de ressources</text><rect class="box" x="90" y="240" width="580" height="40" rx="3"/><text class="lbl" x="380" y="264" text-anchor="middle">secrets hors ENV</text><rect class="box-accent" x="90" y="290" width="580" height="40" rx="3"/><text class="lbl lbl-fill" x="380" y="314" text-anchor="middle">image scannée &amp; signée</text>
</svg>
